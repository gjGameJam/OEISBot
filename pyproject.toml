[project]
name = "oeisbot"
version = "0.1.0"
description = "Local triage tool: find OEIS sequences needing more terms, try to compute them, and produce reviewable artifacts. Never submits anything."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dashboard = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
oeisbot = "oeisbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oeisbot*"]

[tool.setuptools.package-data]
"oeisbot.runners" = ["*.py"]
"oeisbot.dashboard" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sandbox: needs the sandbox runtime installed by `oeisbot setup`",
    "network: talks to oeis.org or github.com",
]
